name: RTNVE code checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python source syntax
        run: |
          python -m compileall -q benchmarks training tests
          python -m unittest discover -s tests -v

  windows-powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows launcher scripts without executing them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('scripts/00_Update.ps1', 'scripts/01_Setup.ps1', 'scripts/02_Run_Benchmark.ps1', 'scripts/03_Run_Temporal.ps1', 'scripts/04_Build_Probe.ps1', 'scripts/05_Test_VAE_Quality.ps1', 'scripts/06_Run_Overnight.ps1', 'scripts/07_Run_Curated.ps1', 'scripts/08_Run_Curated_200.ps1', 'scripts/09_Run_Regional_Loop.ps1', 'scripts/10_Run_Regional_Loop_150.ps1', 'scripts/11_Run_Regional_Softwild.ps1', 'scripts/12_Run_Global_Softwild.ps1', 'scripts/13_Run_Reference_Triplet.ps1', 'scripts/14_Run_Highercar_300_Triplet.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($problem in $errors) {
                Write-Error "$file : $($problem.Message) at line $($problem.Extent.StartLineNumber)"
              }
              throw "PowerShell syntax failed: $file"
            }
            Write-Host "$file parses successfully"
          }
