<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">
  <title>lab</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: white; }
    body { font-family: Arial, Helvetica, sans-serif; color: #111; }
    .page { min-height: 100dvh; display: flex; flex-direction: column; padding: 25px 28px 30px; }
    h1 { margin: 0; font-size: 24px; line-height: 1; font-weight: 600; letter-spacing: -.055em; }
    .artwork { flex: 1; min-height: 0; display: grid; place-items: center; padding: 22px 0 8px; }
    canvas { display: block; width: auto; height: auto; max-width: 100%; max-height: calc(100dvh - 115px); object-fit: contain; }
    .error { display: none; max-width: 410px; font-size: 12px; color: #555; text-align: center; line-height: 1.7; padding: 15px; }
    .error[aria-hidden="false"] { display: block; }
    .sr-only { position: absolute; height: 1px; width: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (max-width: 650px) {
      .page { padding: 18px 18px 20px; }
      h1 { font-size: 22px; }
      .artwork { padding: 18px 0; }
      canvas { max-height: calc(100dvh - 95px); }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>lab</h1>
    <div class="artwork" id="stage">
      <canvas id="art" aria-label="Continuously generated neural artwork"></canvas>
      <p class="error" id="error" aria-hidden="true"></p>
    </div>
    <div class="sr-only" id="status" role="status" aria-live="polite">Loading neural artwork.</div>
  </main>
  <script type="module">
    // Actual generative neural inference. The source is a pinned, vendored
    // copy of ganlive; the model is an existing test model, not yet custom-trained.
    import { gpu, Player, loadPlayable, HAND, HAND_PRIORITY } from "./vendor/ganlive/player.mjs";

    const canvas = document.getElementById("art");
    const stage = document.getElementById("stage");
    const error = document.getElementById("error");
    const status = document.getElementById("status");

    // A URL parameter allows internal A/B testing without adding any interface.
    // Default: photographic places / textures. ?model=faces tests portrait synthesis.
    const models = {
      places: {
        name: "Amber",
        base: "https://huggingface.co/gustavecortal/ganlive-amber/resolve/main/engine/"
      },
      faces: {
        name: "FFHQ",
        base: "https://huggingface.co/gustavecortal/ganlive-ffhq/resolve/main/engine/"
      }
    };
    const selected = new URLSearchParams(location.search).get("model") === "faces"
      ? models.faces : models.places;

    let player, device, running = false;
    let previousVisibility = false;

    function fit() {
      if (!player?.current) return;
      const model = player.current;
      const rect = stage.getBoundingClientRect();
      const ratio = Math.min(
        rect.width / model.width,
        rect.height / model.height,
        1
      );
      const w = Math.max(1, Math.floor(model.width * ratio));
      const h = Math.max(1, Math.floor(model.height * ratio));
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      player.show(Math.max(1, Math.floor(w * dpr)), Math.max(1, Math.floor(h * dpr)));
    }

    function frame(now) {
      requestAnimationFrame(frame);
      if (!running || !player || document.hidden || !previousVisibility) return;
      try {
        player.frame(now);
      } catch (e) {
        running = false;
        showError(e);
      }
    }

    function showError(e) {
      console.error("lab neural generation:", e);
      status.textContent = "Neural artwork could not start.";
      error.textContent = "This neural experiment needs WebGPU in a supported browser with hardware acceleration. " +
        "Technical error: " + (e?.message || String(e));
      error.setAttribute("aria-hidden", "false");
      canvas.style.display = "none";
    }

    async function start() {
      try {
        if (!isSecureContext || !navigator.gpu) {
          throw new Error("WebGPU unavailable. Use an HTTPS page in current Chrome or Edge.");
        }
        status.textContent = "Loading neural model weights.";
        device = await gpu();
        device.lost.then(info => {
          if (running) {
            running = false;
            showError(new Error("GPU connection lost: " + (info.message || "unknown reason")));
          }
        });

        const entry = await loadPlayable(device, selected.base, selected.name, {
          onStage: step => { status.textContent = "Neural model: " + step; }
        });

        player = new Player(device, canvas, { fps: 60, bpm: 125 });
        player.add(entry);
        player.runner.hold(HAND, { speed: .65, spread: .72, hold: 0 }, HAND_PRIORITY);
        fit();
        running = true;
        status.textContent = "Live neural artwork generating.";
        requestAnimationFrame(frame);
      } catch (e) {
        showError(e);
      }
    }

    new ResizeObserver(fit).observe(stage);
    new IntersectionObserver(([entry]) => {
      previousVisibility = entry?.isIntersecting ?? true;
      if (player) player.last = null; // avoid a time jump when returning onscreen
    }, { threshold: 0.01 }).observe(stage);
    document.addEventListener("visibilitychange", () => { if (player) player.last = null; });
    start();
  </script>
</body>
</html>
